description: Generic authenticated HTTP client (system proxy and optional TLS skip).
  Intermediate tool for calling JSON APIs while deciding if a full integration is
  needed. Stores header, body, and query secrets with base_url in one encrypted Config
  blob so credentials are not logged as command arguments and callers cannot retarget
