detaileddescription: |-
  ## Protected HTTP Call

  Generic authenticated HTTP client for Cortex XSOAR / XSIAM. Use it as an **intermediate integration** while you exercise an API and decide whether a dedicated integration is warranted.

  Supports Cortex **system proxy settings** (`proxy`, default false) and optionally **disabling TLS certificate verification** (`insecure`, default false).

  Authentication secrets may live in **headers**, JSON **body** fields, or **query parameters**. Store them in the encrypted **Config** blob together with `base_url`, so they are not passed as command arguments (those are logged) and so callers cannot retarget the credential by changing only an endpoint (`path` cannot be an absolute URL).

  ### Config (`secret_config`)

  `key=value` segments joined by **Config Delimiter** (default ` ||| `).

  - **Required:** `base_url` — `http`/`https`, no trailing slash (query and `#fragment` allowed)
  - **Optional (default `{}`):** `base_headers_json`, `base_body_json`, `base_query_params_json`

  Minimal: `base_url=https://api.example.com`

  Header token: `base_headers_json={"Authorization":"Bearer <token>"} ||| base_url=https://api.example.com`

  Query token: `base_query_params_json={"api_key":"<token>"} ||| base_url=https://api.example.com`

  Body token: `base_body_json={"token":"<token>"} ||| base_url=https://api.example.com`

  Test validates Config only (no HTTP request). For the agent/script contract, run:

  ```text
  !protected-http-call-help
  ```


  ---
  [View Integration Documentation](https://xsoar.pan.dev/docs/reference/integrations/protected-http-call)
